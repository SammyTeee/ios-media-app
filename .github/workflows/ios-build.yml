name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with Xcode 26.6
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build iOS Simulator app
        run: |
          set -o pipefail
          xcodebuild \
            -project iOSApp/MediaRemoteApp.xcodeproj \
            -scheme MediaRemoteApp \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            clean build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package simulator build
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/MediaRemoteApp.app" \
            "$RUNNER_TEMP/MediaRemoteApp-simulator.zip"

      - name: Upload app and build log
        uses: actions/upload-artifact@v7
        with:
          name: MediaRemoteApp-simulator-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/MediaRemoteApp-simulator.zip
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: error
          retention-days: 14

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project iOSApp/MediaRemoteApp.xcodeproj \
            -scheme MediaRemoteApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build | tee "$RUNNER_TEMP/xcodebuild-device.log"

      - name: Package unsigned IPA for Sideloadly
        run: |
          APP_PATH="$RUNNER_TEMP/DeviceDerivedData/Build/Products/Release-iphoneos/MediaRemoteApp.app"
          test -d "$APP_PATH"
          lipo -info "$APP_PATH/MediaRemoteApp"
          mkdir -p "$RUNNER_TEMP/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/Payload/MediaRemoteApp.app"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry MediaRemoteApp-unsigned.ipa Payload
          unzip -t MediaRemoteApp-unsigned.ipa

      - name: Upload Sideloadly IPA
        uses: actions/upload-artifact@v7
        with:
          name: MediaRemoteApp-sideloadly-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/MediaRemoteApp-unsigned.ipa
            ${{ runner.temp }}/xcodebuild-device.log
          if-no-files-found: error
          retention-days: 14
